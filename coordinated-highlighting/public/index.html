<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coordinated Highlighting</title>
  <style>
    body {
      margin: 40px;
      font-family: system-ui, -apple-system, sans-serif;
      background: #fafafa;
      color: #333;
    }
    h1 { font-size: 22px; font-weight: 600; margin-bottom: 4px; }
    p  { font-size: 14px; color: #666; margin-bottom: 24px; }
    .panels { display: flex; gap: 32px; }

    /* Coordinated highlight classes (applied by hylograph runtime) */
    .highlight-primary  { opacity: 1; }
    .highlight-related   { opacity: 1; }
    .highlight-dimmed    { opacity: 0.15; }
  </style>
</head>
<body>
  <h1>Coordinated Highlighting</h1>
  <p>Hover a circle or a bar to highlight the matching element in the other view.</p>
  <div class="panels">
    <div id="circles"></div>
    <div id="bars"></div>
  </div>
  <script src="bundle.js"></script>
</body>
</html>
